---
name: remake 4.4 (Microsoft Windows)

on:
  push:
    branches: [remake-4-4]
  pull_request:
    branches: [remake-4-4]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 & Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            rsync
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-pkg-config
            msys2-runtime-devel
            libtre

      - name: Generate configure POSIX script
        run: autoreconf -i --force

      - name: Configure for GNU (re)Make
        run: ./configure --enable-maintainer-mode

      - name: Pull localization files
        run: make po-update

      - name: Set up to rebuild doc
        run: (cd doc && make stamp-1 stamp-vti)

      - name: Run GNU make to build
        run: make

      - name: Test "remake" just built
        run: make check
      # - name: Check distribution building
      #   run: make distcheck
