---
name: remake 4.4 (macos)

on:
  push:
    branches: [remake-4-4]
  pull_request:
    branches: [remake-4-4]

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew install gcc pkg-config autoconf automake gettext readline guile texinfo texlive
      - name: Generate configure POSIX script
        run: autoreconf -i
      - name: Configure for GNU Make
        run: ./configure --enable-maintainer-mode
      - name: Pull localization files
        run: make po-update
      - name: Set up to rebuild doc
        run: (cd doc && make stamp-1 stamp-vti)
      - name: Run GNU make to build
        run: make
      - name: Test "remake" just built
        run: make check
      # - name: Check distribution building
      #   run: make distcheck
